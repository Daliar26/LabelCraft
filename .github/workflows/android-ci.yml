name: Android CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  unit-tests:
    name: Unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          accept-android-sdk-licenses: true
          log-accepted-android-sdk-licenses: false
          packages: ''
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - name: Install Android SDK packages
        run: sdkmanager --install 'platform-tools' 'platforms;android-36' 'build-tools;36.0.0'
      - name: Run unit tests
        shell: bash
        run: |
          set -o pipefail
          gradle --no-daemon test 2>&1 | tee build.log
      - name: Report errors
        if: failure()
        run: bash tools/ci-report.sh build.log

  assemble-debug:
    name: Assemble debug APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          accept-android-sdk-licenses: true
          log-accepted-android-sdk-licenses: false
          packages: ''
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - name: Install Android SDK packages
        run: sdkmanager --install 'platform-tools' 'platforms;android-36' 'build-tools;36.0.0'
      - name: Assemble debug
        shell: bash
        run: |
          set -o pipefail
          gradle --no-daemon assembleDebug 2>&1 | tee build.log
      - name: Report errors
        if: failure()
        run: bash tools/ci-report.sh build.log
      - uses: actions/upload-artifact@v4
        with:
          name: labelcraft-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14

  assemble-release:
    name: Assemble release APK (unsigned CI artifact)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          accept-android-sdk-licenses: true
          log-accepted-android-sdk-licenses: false
          packages: ''
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - name: Install Android SDK packages
        run: sdkmanager --install 'platform-tools' 'platforms;android-36' 'build-tools;36.0.0'
      - name: Assemble release
        shell: bash
        run: |
          set -o pipefail
          gradle --no-daemon assembleRelease 2>&1 | tee build.log
      - name: Report errors
        if: failure()
        run: bash tools/ci-report.sh build.log
      - uses: actions/upload-artifact@v4
        with:
          name: labelcraft-release-apk-unsigned
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error
          retention-days: 14
